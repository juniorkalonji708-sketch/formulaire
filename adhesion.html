<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhésion - Structure des Acteurs de Cinéma</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Formulaire d'adhésion</h1>

<p>Rejoignez notre structure des acteurs de cinéma en remplissant ce formulaire.</p>

<form action="#" method="post">

<label>Nom complet</label>
<input type="text" placeholder="Votre nom complet" required>

<label>Date de naissance</label>
<input type="date" required>

<label>Sexe</label>
<select required>
<option value="">Choisir</option>
<option>Homme</option>
<option>Femme</option>
</select>

<label>Téléphone</label>
<input type="tel" placeholder="+243..." required>

<label>Email</label>
<input type="email" placeholder="Votre adresse e-mail">

<label>Ville</label>
<input type="text" placeholder="Votre ville">

<label>Profession</label>
<input type="text" placeholder="Ex : Acteur, Réalisateur, Figurant">

<label>Expérience dans le cinéma</label>
<textarea rows="4" placeholder="Décrivez votre expérience"></textarea>

<label>Photo</label>
<input type="file" accept="image/*">

<label>Pourquoi souhaitez-vous adhérer ?</label>
<textarea rows="5"></textarea>
<label for="source">Comment avez-vous été informé(e) de cette annonce ?</label>

<select id="source" name="source" required>
    <option value="">-- Sélectionnez une réponse --</option>
    <option value="facebook">Facebook</option>
    <option value="whatsapp">WhatsApp</option>
    <option value="instagram">Instagram</option>
    <option value="tiktok">TikTok</option>
    <option value="youtube">YouTube</option>
    <option value="radio">Radio</option>
    <option value="television">Télévision</option>
    <option value="ami">Par un ami ou un proche</option>
    <option value="affiche">Affiche ou banderole</option>
    <option value="site">Site web</option>
    <option value="autre">Autre</option>
</select><label for="autreSource">Si autre, veuillez préciser :</label>

<input
    type="text"
    id="autreSource"
    name="autreSource"
    placeholder="Précisez ici...">
<button type="submit">Envoyer ma demande</button>

</form>

</div>

</body>
</html>
